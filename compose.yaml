services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: symfony-php
    volumes:
      - ./:/var/www/symfony
    ports:
      - "9000:9000"

  nginx:
    image: nginx:latest
    container_name: symfony-nginx
    volumes:
      - ./:/var/www/symfony
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: symfony-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony
      MYSQL_USER: user
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: 'aca8ec392ec553092820545d171bdd7572f733b69a736d4fe4fe6c6643555a9c'
      MERCURE_SUBSCRIBER_JWT_KEY: 'aca8ec392ec553092820545d171bdd7572f733b69a736d4fe4fe6c6643555a9c'
      MERCURE_ANONYMOUS: 0
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8080 http://localhost:8080 http://localhost:5173
    ports:
      - "3000:80"
    # Comment the following line to disable the development mode
    # command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:3000/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  db-data:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
